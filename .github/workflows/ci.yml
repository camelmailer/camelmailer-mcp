name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test the server binary
        run: |
          OUTPUT=$(CAMELMAILER_API_KEY= node dist/index.js 2>&1 || true)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q 'CAMELMAILER_API_KEY'
